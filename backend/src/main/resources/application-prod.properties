# =========================================================
# PRODUCTION ONLY
# =========================================================

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production error handling
server.error.include-message=never
server.error.include-stacktrace=never

# JWT
security.jwt.secret=${JWT_SECRET}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =========================================================
# PRODUCTION BOOTSTRAP ADMIN
# =========================================================

app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${APP_ADMIN_NAME}
app.bootstrap-admin.email=${APP_ADMIN_EMAIL}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD}