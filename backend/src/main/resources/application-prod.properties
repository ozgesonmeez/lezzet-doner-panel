# =========================================================
# PRODUCTION ONLY
# =========================================================

# PostgreSQL
# Production ortamında bu değerlerin tamamı environment variable
# olarak verilmek zorundadır.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production error responses
server.error.include-message=never
server.error.include-stacktrace=never

# Production JWT
# JWT_SECRET production ortamında mutlaka tanımlanmalıdır.
# JwtService ayrıca minimum 32 karakter kontrolü yapar.
security.jwt.secret=${JWT_SECRET}

# Production CORS
# Örnek:
# CORS_ALLOWED_ORIGINS=https://panel.lezzetdoner.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production'da varsayılan olarak otomatik admin oluşturma YOK.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}