spring.application.name=lezzet-doner-backend

spring.profiles.default=dev

server.port=${PORT:8080}

# =========================================================
# SECURITY AUTO CONFIGURATION
# =========================================================

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================================================
# JWT
# =========================================================

security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# =========================================================
# LOGIN PROTECTION
# =========================================================

security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}